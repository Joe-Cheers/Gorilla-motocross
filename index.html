<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#111">
  <title>GORILLA MOTOCROSS - Phase 1~6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-shell">
    <canvas id="game" width="1280" height="720" aria-label="GORILLA MOTOCROSS"></canvas>

    <div id="touch-ui" aria-hidden="true">
      <div class="touch-left">
        <button data-key="left" class="touch-btn">◀</button>
        <button data-key="right" class="touch-btn">▶</button>
      </div>
      <div class="touch-right">
        <button data-key="brake" class="touch-btn small">B</button>
        <button data-key="accelerate" class="touch-btn accel">ACCEL</button>
        <button data-key="nose" class="touch-btn small">▼</button>
      </div>
    </div>

    <div id="portrait-message">
      <div>📱</div>
      <strong>画面を横向きにしてください</strong>
      <span>GORILLA MOTOCROSS</span>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
